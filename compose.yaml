services:
  postgres:
    image: 'postgres:latest'
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
    ports:
      - "${DB_PORT}:5432"
  rabbitmq:
    image: 'rabbitmq:latest'
    environment:
      - RABBITMQ_DEFAULT_PASS=${RQM_PSWD}
      - RABBITMQ_DEFAULT_USER=${RQM_USER}
    ports:
      - '5672'
  redis:
    image: 'redis:latest'
    ports:
      - '6379'
